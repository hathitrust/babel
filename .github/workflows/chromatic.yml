name: 'Chromatic'

on:
  push:
    branches-ignore:
      - deployment
    tags-ignore:
      - '**'
    paths:
      - 'pt/**'
      - '.github/workflows/chromatic.yml'

jobs:
  chromatic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pt/web/firebird
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          workingDir: pt/web/firebird
