name: Run Tests

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  perl_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hathitrust/imgsrv-sample-data
          path: sample-data

      - name: setup env
        run: /bin/bash ./setup-env.sh

      - name: Run perl tests
        run: docker compose run perl-test

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: pt/web/firebird/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: pt/web/firebird
      - name: Check formatting
        run: npm run format:check
        working-directory: pt/web/firebird

  playwright:
    runs-on: ubuntu-latest
    needs: perl_test

    steps:
      # Check out this repo by default
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hathitrust/imgsrv-sample-data
          path: sample-data

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hathitrust/firebird-common
          path: firebird-common

      - name: setup env
        run: /bin/bash ./setup-env.sh

      - name: Build firebird
        run: docker compose run firebird ./bin/build.sh

      - name: Build pageturner
        run: docker compose run page-turner /htapps/babel/pt/bin/build.sh

      - name: Run playwright tests (PageTurner)
        run: ./bin/run_playwright_tests.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v 7.0.1
        if: ${{ failure() }}
        with:
          name: test-results
          path: pt/web/firebird/test-results/
          retention-days: 21
