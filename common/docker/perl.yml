services:
  perl:
    # This is a container used to run tests by default but also used for some development. Not related to the frontend
    build:
      context: ../../
      target: babel-base
    volumes:
    - ${BABEL_HOME}:/htapps/babel
    - ${BABEL_HOME}/sample-data/sdr1:/sdr1
    - ${BABEL_HOME}/sample-data/etc:/htapps/babel/etc
    # Allow tests to modify database
    - ${BABEL_HOME}/logs:/var/log/babel
    environment:
    - SDRROOT=/htapps/babel
    - SDRDATAROOT=/sdr1
    - MARIADB_USER=ht_web
    - HTDEV=test
    - PERL5LIB=/htapps/babel/mdp-lib
    - LSS_SOLR_ENGINE_URL_A=http://${LSS_SOLR_HOST:-solr-lss-dev}:8983/solr/core-x
    - LSS_SOLR_ENGINE_URL_B=http://${LSS_SOLR_HOST:-solr-lss-dev}:8983/solr/core-y
    # This is the basic auth for Solr. The default 'admin:solrRocks' credential
    - LSS_SOLR_BASIC_AUTH=YWRtaW46c29sclJvY2tz
    depends_on:
      mysql-sdr:
        condition: service_healthy
    working_dir: "/htapps/babel"
    command: "prove -r imgsrv/t ls/t mdp-lib/t"
