# Services required for minimum babel functionality & used by tests

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 10s
  start_period: 10s
  retries: 5

services:
  solr-sdr-catalog:
    # This is a core service (catalog search index)
    image: ghcr.io/hathitrust/catalog-solr-sample
    ports:
    - "9033:9033"
    volumes:
    - solr_sdr_catalog:/var/solr
    healthcheck:
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 5
      test: "curl -f --retry-connrefused http://localhost:9033"

  mysql-sdr:
    # This is a core service
    image: ghcr.io/hathitrust/db-image:latest
    volumes:
    - ${BABEL_HOME}/slip/etc/sql/100_slip.sql:/docker-entrypoint-initdb.d/100_slip.sql
    - ${BABEL_HOME}/sql/permissions.sql:/docker-entrypoint-initdb.d/201_permissions.sql
    - ${BABEL_HOME}/sql/auth.sql:/docker-entrypoint-initdb.d/202_auth.sql
    - ${BABEL_HOME}/sql/sample_rights.sql:/docker-entrypoint-initdb.d/203_sample_rights.sql
    - ${BABEL_HOME}/mb/etc/sql/999_mb.sql:/docker-entrypoint-initdb.d/999_mb.sql
    - ${BABEL_HOME}/sql/vufind_session.sql:/docker-entrypoint-initdb.d/888_vufind.sql
    - mysql_sdr_data:/var/lib/mysql
    ports:
    - "3307:3306"
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized" ]

  imgsrv:
    # This a core dependency
    build:
      context: ../../
      target: imgsrv-fcgi
    user: ${CURRENT_USER}
    volumes:
    - ${BABEL_HOME}:/htapps/babel
    - ${BABEL_HOME}/sample-data/sdr1:/sdr1
    - ${BABEL_HOME}/sample-data/etc:/htapps/babel/etc
    - ${BABEL_HOME}/sample-data/watermarks:/htapps/babel/watermarks
    - ${BABEL_HOME}/sample-data:/tmp/sample-data
    - ${BABEL_HOME}/logs:/var/log/babel
    environment:
    - SDRROOT=/htapps/babel
    - SDRDATAROOT=/sdr1
    - HT_DEV=docker
    - REMOTE_ADDR=127.0.0.1
    - HTTP_HOST=127.0.0.1
    - APACHE_LOG_DIR=/tmp
    depends_on:
      mysql-sdr:
        condition: service_healthy
      solr-sdr-catalog:
        condition: service_healthy
    ports:
    - "31028:31028"
    command: bash -c "/htapps/babel/imgsrv/bin/startup_imgsrv"
    healthcheck:
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 5
      test: "cgi-fcgi -bind -connect 127.0.0.1:31028"

volumes:
  mysql_sdr_data:
  solr_sdr_catalog:
